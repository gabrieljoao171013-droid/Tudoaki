<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tudo Aqui Utilidades</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f8ff;--card:#fff;--tx:#0b2a5b;--mut:#5a6b8c;--blue:#0b4fb3;--blue2:#1f7aec;--yel:#ffc928;--yel2:#fff3c2;--bd:#e3e9f6;--ok:#1a8a4a;--er:#c0362c;--sh:0 4px 16px rgba(11,79,179,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1424;--card:#14233b;--tx:#f4f1e2;--mut:#a3b1cb;--blue:#5b9bff;--blue2:#2d6fd6;--yel2:#3a3210;--bd:#27395a;--ok:#4cd08a;--er:#ff7b70;--sh:0 4px 16px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1424;--card:#14233b;--tx:#f4f1e2;--mut:#a3b1cb;--blue:#5b9bff;--blue2:#2d6fd6;--yel2:#3a3210;--bd:#27395a;--ok:#4cd08a;--er:#ff7b70;--sh:0 4px 16px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:150px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b4fb3;z-index:30}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes flt{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes bg{0%{background-position:0 50%}100%{background-position:200% 50%}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,40,.6)}50%{box-shadow:0 0 0 10px rgba(255,201,40,0)}}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes chk{to{stroke-dashoffset:0}}
header{background:linear-gradient(90deg,#0b4fb3,#1f7aec,#0b4fb3);background-size:200% 100%;animation:bg 8s linear infinite;color:#fff;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.logo{width:44px;height:44px;border-radius:50%;background:#fff;overflow:hidden;flex:none;animation:pop .6s both;box-shadow:0 0 0 2px #ffc928}.logo img{width:100%;height:100%;display:block}
.stat{display:flex;gap:12px;align-items:center;background:var(--yel2);border-radius:14px;padding:10px 12px;margin:8px 0}.stat .se{font-size:30px}.stat.s3 .se,.stat.s4 .se{animation:flt 1.6s infinite}.stat.s5{background:rgba(26,138,74,.15)}
.cbox{text-align:center;border:2px dashed var(--blue);border-radius:14px;padding:10px;margin:8px 0;animation:pop .5s}
.qr{background:#fff;padding:8px;border-radius:12px;width:190px;margin:8px auto}.qr svg{width:100%;height:auto;display:block}
header b{font-size:17px;line-height:1.1}header small{display:block;opacity:.85;font-size:11px}
#adm{margin-left:auto;background:#ffc928;color:#0b2a5b;border-radius:8px;padding:2px 8px;font-weight:800;font-size:12px}#adm:empty{display:none}
main{max-width:720px;margin:0 auto;padding:14px}
.fresh>*{animation:up .45s both}.fresh>*:nth-child(2){animation-delay:.06s}.fresh>*:nth-child(3){animation-delay:.12s}.fresh>*:nth-child(4){animation-delay:.18s}.fresh>*:nth-child(n+5){animation-delay:.24s}
.fresh>.bar{animation:none}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:600px;margin:auto;background:var(--card);border-radius:20px;box-shadow:0 6px 24px rgba(11,79,179,.25);display:flex;padding:5px;z-index:20;border:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 2px;font-size:11px;font-weight:700;border-radius:15px;transition:.25s;position:relative}
nav button span{display:block;font-size:19px;transition:.25s}nav button.on{background:var(--yel);color:#0b2a5b}nav button.on span{transform:translateY(-2px) scale(1.15)}
nav i{position:absolute;top:2px;right:18%;background:var(--er);color:#fff;border-radius:99px;font-style:normal;font-size:10px;padding:0 5px;animation:bump .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.grid .card{margin:0;padding:8px}.grid .card:hover{transform:translateY(-4px)}.fresh .grid .card{animation:up .5s both;animation-delay:calc(var(--i)*45ms)}
.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--yel2);display:grid;place-items:center;font-size:38px;margin-bottom:6px}
.pr{color:var(--blue);font-weight:800;font-size:17px}.mut{color:var(--mut);font-size:13px}
button,input,select,textarea{font:inherit}
.b{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:700;transition:transform .12s,filter .2s}.b:active{transform:scale(.95)}.b:hover{filter:brightness(1.1)}.b:disabled{opacity:.45}
.y{background:var(--yel);color:#0b2a5b}.g{background:none;border:1px solid var(--bd);color:var(--tx)}.w{width:100%;margin-top:8px}.cta{animation:pulse 2s infinite}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:4px 0 8px;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(31,122,236,.2)}
label{font-size:13px;font-weight:700}h2{margin:6px 0 12px;color:var(--blue)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--yel2)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{margin:0}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b4fb3,#1f7aec);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;border-bottom:6px solid var(--yel);box-shadow:var(--sh)}
.hero b{font-size:22px;display:block;max-width:70%}.hero p{margin:4px 0 0;opacity:.9;max-width:70%}.hero em{position:absolute;right:16px;top:14px;font-size:54px;font-style:normal;animation:flt 4s ease-in-out infinite}.hero em+em{top:auto;bottom:6px;right:80px;font-size:30px;animation-delay:1s}
.chips,.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.chips button,.seg button{white-space:nowrap;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;transition:.2s}
.chips .on,.seg .on{background:var(--blue);color:#fff;border-color:var(--blue);transform:scale(1.04)}.seg button{flex:1;border-radius:12px}
.st{display:flex;gap:8px;align-items:center;font-weight:800;margin-bottom:8px}.st i{background:var(--yel);color:#0b2a5b;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:600px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 24px rgba(11,79,179,.25);z-index:15;animation:pop .4s}
.empty{text-align:center;padding:40px 10px}.big{font-size:60px;animation:flt 3s infinite}
.tl{display:flex;margin:10px 0}.tl div{flex:1;text-align:center;font-size:10px;color:var(--mut);position:relative}.tl div::before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--bd);margin:0 auto 4px;transition:.4s;position:relative;z-index:1}
.tl div::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--bd)}.tl div:first-child::after{display:none}
.tl .d::before{background:var(--ok);transform:scale(1.2)}.tl .d::after{background:var(--ok)}.tl .d{color:var(--tx);font-weight:700}
.msg{padding:7px 11px;border-radius:14px;margin:4px 30px 4px 0;background:var(--yel2);animation:pop .3s}.msg.me{background:var(--blue);color:#fff;margin:4px 0 4px 30px}
.code{font-size:28px;letter-spacing:7px;font-weight:800;color:var(--blue)}.er{color:var(--er)}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#c0362c;color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;z-index:50;animation:tin .35s;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center}.toast.ok{background:#1a8a4a}
.ov{position:fixed;inset:0;background:rgba(5,15,40,.55);display:grid;place-items:center;z-index:60;animation:up .2s;padding:20px}.dl{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:340px;animation:pop .3s}
.okb{text-align:center;background:var(--yel2);border-radius:18px;padding:14px;margin-bottom:12px;animation:pop .5s}.okb svg{width:56px;height:56px}.okb path{stroke:var(--ok);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:chk .7s .3s forwards}.okb circle{stroke:var(--ok);stroke-width:3;fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

 return `<h2>Resumo</h2><div class="grid"><div class="card"><div class="mut">Em andamento</div><b class="pr">${D.orders.filter(o=>o.st<5).length}</b></div><div class="card"><div class="mut">Vendas pagas</div><b class="pr">${R(vendas())}</b><br><button class="g b" style="padding:4px 10px;font-size:12px;margin-top:4px" onclick="zerar()">Zerar vendas</button></div><div class="card"><div class="mut">Estoque baixo (≤3)</div><b class="pr">${D.products.filter(p=>p.s<=3).length}</b></div></div><h2 style="margin-top:14px">Novo produto</h2>
 <div class="card"><label>Foto</label><input type="file" accept="image/*" onchange="foto(this)"><div id="pv">${img?`<img class="ph" style="max-width:120px" src="${img}">`:''}</div>
 <label>Nome</label><input id="pn"><label>Categoria</label><input id="pc" placeholder="Cozinha, Limpeza..."><div class="row"><div style="flex:1"><label>Preço (R$)</label><input id="pp" type="number" step="0.01" inputmode="decimal"></div><div style="flex:1"><label>Estoque</label><input id="ps" type="number" inputmode="numeric"></div></div>
 <label>Descrição</label><textarea id="pd" rows="2"></textarea><button class="b y w" onclick="novo()">Cadastrar produto</button></div>
 <h2>Produtos</h2>${D.products.map(p=>`<div class="card row"><div><b>${E(p.n)}</b><div class="mut">${R(p.p)} · estoque ${p.s} ${p.s<=0?'<span class="er">· Esgotado (oculto da loja)</span>':''}</div></div><div><button class="g b" onclick="est('${p.id}')">Estoque</button> <button class="g b er" onclick="del('${p.id}')">🗑</button></div></div>`).join('')||'<p class="mut">Nenhum produto.</p>'}
 <h2>Administradores</h2><div class="card">${D.users.filter(u=>u.admin).map(u=>`<div class="row"><span>${E(u.nome)} · ${E(u.email)}${u.email==D.me?' (você)':''}</span>${u.email==D.me?'':`<button class="g b er" onclick="rmAdm(decodeURIComponent('${U(u.email)}'))">Remover</button>`}</div>`).join('')}<p class="mut">Só administradores veem todas as compras e os endereços. O código de segurança fica só com o cliente.</p></div><h2>Fretes por região</h2><div class="card"><p class="mut">Valores estimados: ajuste conforme seus custos reais (combustível, moto, entregador e barco).</p>${Object.keys(D.fr).map(k=>`<div class="row"><span>${E(k)}</span><input type="number" style="width:90px" value="${D.fr[k]}" onchange="D.fr[decodeURIComponent('${U(k)}')]=+this.value;sv()"></div>`).join('')}</div>`}
function foto(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.7);$('#pv').innerHTML=`<img class="ph" style="max-width:120px" src="${img}">`};i.src=r.result};r.readAsDataURL(f)}
function novo(){const n=$('#pn').value.trim(),p=parseFloat($('#pp').value),s=parseInt($('#ps').value);if(!n||isNaN(p)||isNaN(s)){toast('Preencha nome, preço e estoque.');return}
 D.products.unshift({id:Date.now().toString(36),n,c:$('#pc').value.trim(),p,s,d:$('#pd').value.trim(),i:img});img='';sv();toast('Produto cadastrado ✓',1);draw()}
async function est(id){const p=D.products.find(x=>x.id==id),v=await ask('Novo estoque de '+p.n,1,p.s);if(v!==null&&v!==''&&!isNaN(+v)){p.s=+v;sv();draw()}}
async function del(id){if(await ask('Excluir produto?')){D.products=D.products.filter(p=>p.id!=id);sv();draw()}}
function lk(t,m){return `<a href="#" onclick="am='${m}';fresh=1;draw();return false">${t}</a>`}
function vConta(){
 const u=me();
 if(u)return `<h2>Olá, ${E(u.nome)} 👋</h2><div class="card">${E(u.email)}<br>${u.admin?'<span class="tag">Administrador</span>':''}
 ${u.admin?'':`<label style="display:block;margin-top:8px">Quer ser administrador? Digite o código</label><input id="ac" type="password" placeholder="Código de administrador"><button class="b w" onclick="tornar()">Tornar-me administrador</button>`}
 <button class="g b w" onclick="D.me=null;sv();go('loja')">Sair</button></div>
 <div class="card mut">🔒 Seus dados (localização e endereço) são usados só para a entrega. Esta versão de demonstração guarda tudo neste aparelho.</div>`;
 return authForm()}
function authForm(){
 const T={in:['Entrar com e-mail','Entrar','ent()'],up:['Criar conta','Criar conta','cad()'],rec:['Recuperar senha','Redefinir senha','rec()']}[am];
 return `<h2>${T[0]}</h2><div class="card"><div class="seg"><button class="${am!='up'?'on':''}" onclick="am='in';draw()">Entrar</button><button class="${am=='up'?'on':''}" onclick="am='up';draw()">Criar conta</button></div>${am=='up'?'<label>Nome</label><input id="un"><label>WhatsApp</label><input id="ut" inputmode="tel">':''}
 <label>E-mail</label><input id="ue" type="email" autocomplete="email" value="${E(D.last||'')}" placeholder="seuemail@exemplo.com">
 ${am=='rec'?'<label>WhatsApp cadastrado</label><input id="ut" inputmode="tel"><label>Nova senha</label><input id="up" type="password">':'<label>Senha</label><input id="up" type="password" autocomplete="current-password">'}
 <button class="b y w" onclick="${T[2]}">${T[1]}</button>
 <p class="mut" style="text-align:center">${[am!='in'&&lk('Já tenho conta','in'),am!='up'&&lk('Criar conta','up'),am!='rec'&&lk('Esqueci a senha','rec')].filter(Boolean).join(' · ')}</p></div>
 <div class="card mut">📧 Nesta versão o e-mail é seu usuário de acesso. Código por e-mail e login com Google chegam na Versão 2, com servidor.</div>`}
async function cad(){const n=$('#un').value.trim(),e=$('#ue').value.trim().toLowerCase(),p=$('#up').value;if(!n||!e||p.length<4){toast('Preencha nome, e-mail e senha (mín. 4).');return}
 if(D.users.some(u=>u.email==e)){toast('E-mail já cadastrado.');return}
 D.users.push({nome:n,tel:$('#ut').value,email:e,h:await sha(p),admin:false});D.me=e;D.last=e;sv();toast('Conta criada ✓',1);go(Object.keys(cart).length?'cart':'loja')}
async function ent(){const e=$('#ue').value.trim().toLowerCase(),h=await sha($('#up').value),u=D.users.find(x=>x.email==e&&x.h==h);if(!u){toast('E-mail ou senha incorretos.');return}D.me=e;D.last=e;sv();toast('Bem-vindo! ✓',1);go(Object.keys(cart).length?'cart':'loja')}
async function rec(){const e=$('#ue').value.trim().toLowerCase(),t=$('#ut').value.replace(/\D/g,''),p=$('#up').value,u=D.users.find(x=>x.email==e);
 if(!u||!t||u.tel.replace(/\D/g,'')!=t||p.length<4){toast('Dados não conferem ou senha curta (mín. 4).');return}
 u.h=await sha(p);D.me=e;D.last=e;sv();toast('Senha redefinida ✓',1);go('loja')}
let showOld=false;
function vis(o){if(o.st<5||showOld)return true;const f=(o.h||[]).find(x=>x[0]==5);return !!f&&Date.now()-f[1]<864e5}
const MSG=[['⏳','Aguardando seu pagamento','Pague com PIX (instruções abaixo) para a loja começar a separar.'],['🔎','Pagamento informado','Você avisou que pagou. A loja confere e confirma em instantes. Você não precisa fazer mais nada.'],['✅','Pagamento confirmado','Seu pedido entra na fila de separação.'],['🧑‍🍳','Sendo separado agora','A equipe está separando seus itens.'],['🛵','Saiu para entrega','O entregador está a caminho. Deixe o código em mãos!'],['✅','Já saiu: pedido entregue','Obrigado pela compra! Este pedido some da lista 24 horas depois.']];
function tlv(i,v){return i+String(v.length).padStart(2,'0')+v}
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixCode(v,id){const p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01','63857852000110'))+tlv('52','0000')+tlv('53','986')+tlv('54',Number(v).toFixed(2))+tlv('58','BR')+tlv('59','TUDOAKI UTILIDADES')+tlv('60','VALENCA')+tlv('62',tlv('05',String(id).replace(/[^A-Za-z0-9]/g,'').slice(0,20)||'***'))+'6304';return p+crc(p)}
function qrSvg(s){try{const q=qrcode(0,'M');q.addData(s);q.make();return q.createSvgTag(4,0)}catch(e){return ''}}
async function rmAdm(e){if(await ask('Remover este administrador?')){D.users.find(u=>u.email==e).admin=false;sv();draw()}}
async function tornar(){if(await sha($('#ac').value)===HASH){me().admin=true;sv();toast('Agora você é administrador 🎉',1);draw()}else toast('Código incorreto.')}
function vendas(){return D.orders.filter(o=>o.st>=2&&((o.h||[]).find(x=>x[0]==2)?.[1]||0)>(D.vz||0)).reduce((a,o)=>a+o.t,0)}
async function zerar(){if(await ask('Zerar o valor de vendas? Os pedidos continuam salvos.')){D.vz=Date.now();sv();toast('Vendas zeradas ✓',1);draw()}}
if(!D.vz){D.vz=Date.now();sv()}
draw();
</script></body></html>
